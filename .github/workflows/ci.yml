name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: constellation
          POSTGRES_PASSWORD: constellation
          POSTGRES_DB: constellation
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U constellation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://constellation:constellation@localhost:5432/constellation
      WEB_ORIGIN: http://localhost:3000
      # Valores de prueba: los e2e sustituyen Discord por un doble.
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000000
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      DISCORD_CALLBACK_URL: http://localhost:3001/v1/auth/discord/callback
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: api/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: api/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - name: Migraciones y seed sobre BD limpia (dos veces = idempotente)
        run: |
          pnpm migration:run:prod
          pnpm seed:prod
          pnpm seed:prod | tee seed2.log
          grep -q '"inserted":0,"updated":0,"deleted":0},"courses":{"inserted":0,"updated":0,"deleted":0}' seed2.log

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://backend.constellation.waldirmaidana.com

  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validar catálogo
        run: |
          if [ -f api/src/catalog/infrastructure/seed/catalog.json ]; then
            node tools/catalog/validate-catalog.mjs
            node --test tools/catalog/validate-catalog.test.mjs
          else
            echo "Sin catalog.json todavía"
          fi
